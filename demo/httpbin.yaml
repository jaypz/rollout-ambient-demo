apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: httpbin
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: cnoe://manifests/httpbin
      path: ./
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: httpbin
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
        istio.io/use-waypoint: waypoint
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true