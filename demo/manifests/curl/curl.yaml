apiVersion: v1
kind: Pod
metadata:
  name: curl-debug
  labels:
    app: curl-debug
spec:
  containers:
    - name: curl
      image: curlimages/curl:latest
      command: ["/bin/sh", "-c", "sleep infinity"]
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
      env:
        - name: HTTPBIN_SVC
          value: "http://api.httpbin.svc"
  restartPolicy: OnFailure