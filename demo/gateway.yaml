apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: cnoe://manifests/gateway
      path: ./
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ingress
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true