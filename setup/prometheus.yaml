apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 28.8.0
      chart: prometheus
      helm:
        valuesObject:
          server:
            retention: 2h
          alertmanager:
            enabled: false
          pushgateway:
            enabled: false
          prometheus-node-exporter:
            enabled: false
          prometheus-pushgateway:
            enabled: false
          kube-state-metrics:
            enabled: true
    - repoURL: cnoe://manifests/prometheus
      path: ./
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true